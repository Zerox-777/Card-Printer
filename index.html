<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Card Printer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="dashboard">
        <h1 class="gradient-title">Deck Collection</h1>
    
    <div class="actions" style="text-align:center; margin-bottom:30px;">
        <button class="btn-primary" onclick="createDeck('J')">➕ Create Deck (Japanese)</button>
        <button class="btn-primary" onclick="createDeck('S')">➕ Create Deck (Standard)</button>
    </div>
    
    <!-- Vùng chứa danh sách hoặc trạng thái trống -->
    <div id="deck-list-container">
        <!-- Trạng thái trống -->
        <div id="empty-state" style="display:none; text-align:center; padding:40px;">
            <h3 style="color:#6c757d; margin-bottom:10px;">Your deck collection is empty!</h3>
            <p style="color:#adb5bd;">Click the buttons above to create your first deck.</p>
        </div>
        
        <!-- Lưới chứa các bộ bài -->
        <div id="deck-list"></div>
    </div>
    </div>

    <div id="editor" style="display:none;">
        <div class="editor-header" style="text-align:center;">
        <!-- Tận dụng lại class gradient-title của trang chủ -->
        <h2 class="gradient-title">Deck Editor</h2>
        <div style="margin-bottom:15px;">
            <label for="deck-name-input" style="font-weight:bold;">Deck Name: </label>
            <input type="text" id="deck-name-input" placeholder="Enter deck name..." 
                   style="padding:8px; width:250px; border-radius:4px; border:1px solid #ccc;">
        </div>
        <p id="deck-stats" style="color:#6c757d;font-size:1.2em;font-weight:bold;margin-bottom:20px;">Total Cards: 0</p>
    </div>

    <!-- Thanh công cụ sẽ dính chặt trên đầu khi cuộn trang -->
    <div class="sticky-controls">
        <button class="btn-secondary" onclick="goBack()">🔙 Back</button>
        <button class="btn-primary" onclick="document.getElementById('upload-input').click()">📁 Upload Cards</button>
        <button class="btn-success" onclick="saveDeck()">💾 Save</button>
        <button class="btn-warning" onclick="printPDF()">🖨️ Print PDF</button>
    </div>

    <input type="file" id="upload-input" multiple accept="image/*" onchange="handleUpload(event)" style="display:none;">

    <!-- Đổi id grid để css không bị trùng lặp -->
    <div id="card-grid" class="editor-grid"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
